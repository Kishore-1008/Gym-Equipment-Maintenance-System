spring.application.name=gym-ams-backend
server.port=8080

# ---------- MySQL ----------
# Update username/password/db name for your local MySQL instance.
# createDatabaseIfNotExist=true will create the schema on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/gym_ams?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=kishore100108
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update lets Hibernate create/update the users and equipment
# tables from the entities below. Switch to "validate" once the schema
# is stable in a real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Replace with a long random secret (32+ bytes) before any real deployment.
app.jwt.secret=change-this-to-a-long-random-secret-key-please-min-32-bytes
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
# Origins allowed to call this API from the browser. Add/remove entries
# to match whatever you use to serve the static frontend files
# (VS Code Live Server, http-server, etc). Comma-separated, no spaces.
app.cors.allowed-origins=http://127.0.0.1:5501,http://localhost:5501
