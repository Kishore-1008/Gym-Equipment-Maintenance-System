<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Manager Dashboard · Gym Equipment Maintenance System</title>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="dash-nav">
    <div class="brand d-flex align-items-center gap-2">
      <div class="brand-mark">G</div>
      <span class="brand-name">Gym Equipment Maintenance System</span>
    </div>
    <button class="btn-logout" id="logoutBtn">Log Out</button>
  </nav>

  <main class="dash-center">
    <p class="dash-greeting" id="dashGreeting">Welcome!</p>

    <div class="user-card">
      <div class="user-card-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8" />
          <path d="M5 19c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </div>

      <div class="user-card-rows">
        <div class="user-card-row">
          <span class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" />
              <path d="M5.5 19c0-3 3-5.5 6.5-5.5s6.5 2.5 6.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
          <div class="row-text">
            <span class="row-label">Full Name</span>
            <span class="row-value" id="detailFullName">—</span>
          </div>
        </div>

        <div class="user-card-row">
          <span class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
              <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div class="row-text">
            <span class="row-label">Username</span>
            <span class="row-value" id="detailUsername">—</span>
          </div>
        </div>

        <div class="user-card-row">
          <span class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21s7-3.5 7-9V6l-7-2.5L5 6v6c0 5.5 7 9 7 9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div class="row-text">
            <span class="row-label">Role</span>
            <span class="row-value" id="detailRole">—</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => requireSession("GYM_MANAGER"));
  </script>
</body>
</html>
